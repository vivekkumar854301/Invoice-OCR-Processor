<h2>
    <div class="header-icon"><i class="ngce-doc-text"></i></div>{{ title }}
</h2>
<section [formGroup]="formGroup">
    <div class="fields-grid">
        <label *ngFor="let field of fields">
            {{ field.label }}:
            <input [formControlName]="field.controlName" [type]="field.type" />
        </label>
    </div>
</section>
