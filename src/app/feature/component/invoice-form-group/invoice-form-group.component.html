<h3>Invoice Information</h3>
<section id="invoice-section">
    <h2>Invoice Details</h2>
    <div class="fields-grid">
        <label>Invoice Number:
            <input formControlName="invoice_number" type="text" />
        </label>
        <label>Invoice Date:
            <input formControlName="invoice_date" type="date" />
        </label>
        <label>IRN Number:
            <input formControlName="irn_number" type="text" />
        </label>
        <label>Acknowledgement No:
            <input formControlName="acknowledgement_no" type="text" />
        </label>
        <label>Acknowledgement Date:
            <input formControlName="acknowledgement_data" type="text" />
        </label>
        <label>E-Way Bill No:
            <input formControlName="e_way_bill_no" type="text" />
        </label>
    </div>
</section>
