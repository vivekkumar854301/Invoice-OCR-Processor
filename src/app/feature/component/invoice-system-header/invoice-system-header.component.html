<header class="header">
    <div class="header-content">
        <div class="logo">
            <span class="clarium" [routerLink]="['']">
                NEXTRIQ

            </span>
        </div>
        <nav class="nav">
            @if(isLayoutDropdownVisible()){
            <ngce-select [dataSource]="layoutOptions" (valueChange)="layoutOptionChanged($event)"
                [(ngModel)]="option"></ngce-select>
            }

            <a [routerLink]="['invoices']">View All Invoices</a>
            <ngce-button [customStyles]="{backgroundColor:'#0077b6'}" (handleClick)="onUploadClick()">Upload
                Invoice</ngce-button>
        </nav>
    </div>
</header>
